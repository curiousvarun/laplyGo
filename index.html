    <!-- Apply the persisted theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      ;(() => {
        try {
          const settings = JSON.parse(
            localStorage.getItem('study-stopwatch.settings.v1') || 'null',
          )
          const preference = settings && settings.theme ? settings.theme : 'dark'
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const isDark = preference === 'dark' || (preference === 'system' && prefersDark)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', isDark ? '#09090b' : '#f7f7f4')
        } catch {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
